name: CHAOS source verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_standalone.py --check
      - name: Focused existing regression tests
        run: |
          set -e
          for test in tests/unit/tackle_reengagement.test.js tests/unit/tackle_intelligence.test.js tests/unit/low_contact.test.js tests/unit/pursuit_reaction.test.js tests/unit/contact_feedback.test.js; do
            node "$test"
          done
